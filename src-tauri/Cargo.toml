[package]
name = "intermediary"
version = "0.1.18"
description = "Intermediary - Context bundling app for AI agents"
authors = ["JL"]
edition = "2021"

[lib]
name = "intermediary_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib/mod.rs"

[[bin]]
name = "intermediary"
path = "src/bin/intermediary.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-drag = "2.1"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
dirs = "5.0"
chrono = "0.4"
once_cell = "1.19"
regex = "1.10"
im_bundle = { path = "../crates/im_bundle" }
uuid = { version = "1.8", features = ["v4"] }
# Integrated terminal: ConPTY on Windows, openpty elsewhere (keeps the WSL `cargo check` green)
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
# Integrated terminal, Win32 calls the terminal module makes directly:
# - Win32_System_DataExchange + Win32_System_Memory: OpenClipboard / GetClipboardData(CF_UNICODETEXT) /
#   GlobalLock / GlobalUnlock / CloseClipboard (WebView2 cannot read the clipboard without a prompt)
# - Win32_System_Registry: RegGetValueW for CurrentBuildNumber (xterm's ConPTY reflow needs the build)
# - Win32_Foundation: the handle and status types those calls use
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3.10"
