# Path: crates/im_bundle/Cargo.toml
# Description: Rust bundle builder (scan + zip) for Intermediary

[package]
name = "im_bundle"
version = "0.1.14"
edition = "2021"

description = "Bundle scanning + zip creation for Intermediary"

[lib]
path = "src/lib.rs"

[[bin]]
name = "im_bundle_cli"
path = "src/bin/im_bundle_cli.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1.0"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Object ownership of a spawned process tree (src/process_job.rs):
# CreateJobObjectW (no limits set), AssignProcessToJobObject,
# TerminateJobObject, CloseHandle. Version is the copy the workspace lock
# already resolved. Win32_Security and Win32_System_Threading are not called
# into: the JobObjects module's own signatures name SECURITY_ATTRIBUTES and
# IO_COUNTERS, so it does not compile without them. Win32_Storage_FileSystem
# is MoveFileExW, the no-replace rename in src/fs_atomic.rs.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.10"
